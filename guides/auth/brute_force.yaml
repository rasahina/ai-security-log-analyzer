title: "ブルートフォース攻撃"

plain_explanation: |
  ログイン画面に対して、短時間に複数回の失敗アクセスが確認されています。
  パスワードの総当たりや、漏洩した認証情報の試行である可能性があります。

immediate_actions:
  - "不審なログイン試行がないか管理画面で確認する"
  - "該当IPからのアクセスが続く場合は一時的にブロックする"
  - "管理者アカウントに不審なログイン成功履歴がないか確認する"

short_term_actions:
  - "ログイン履歴を確認する（CMS・管理画面）"
  - "対象アカウントのパスワードを変更する"
  - "不要なアカウントを無効化または削除する"

long_term_actions:
  - "2段階認証（2FA）を有効化する"
  - "ログイン試行回数制限を導入する"
  - "CAPTCHAやWAFによる保護を設定する"

escalation:
  - "ログイン成功の疑いがある場合は、即座に専門家へ相談する"
  - "複数IPから攻撃が継続する場合は広範囲攻撃として調査する"

admin_support:
  - "サーバ設定が変更できない場合はホスティング会社に相談する"
  - "セキュリティ設定の強化を管理者に依頼する"

advanced_commands:
  enabled: true
  warning: "以下は内容を理解している管理者向けです。誤って実行すると通信に影響する可能性があります。"

  commands:
    - label: "ログイン失敗の確認"
      description: "直近のログイン失敗を確認する"
      command: "sudo grep '401\\|403' /var/log/nginx/access.log | grep '/login'"

    - label: "IPを一時ブロックする例"
      description: "攻撃元IPを遮断する"
      command: "sudo iptables -A INPUT -s {ip} -j DROP"