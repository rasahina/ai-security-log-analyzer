title: "短時間アクセス集中"

plain_explanation: |
  短時間に大量のアクセスが集中しています。
  正常なトラフィックの可能性もありますが、攻撃の兆候の可能性もあります。

immediate_actions:
  - "アクセス元IPと対象URLを確認する"

short_term_actions:
  - "異常なアクセスであればIP制限を検討する"

long_term_actions:
  - "レート制限を導入する"
  - "トラフィック監視を強化する"

escalation:
  - "サービスに影響が出ている場合は緊急対応する"

admin_support:
  - "CDNや負荷分散の導入を検討する"

advanced_commands:
  enabled: true
  warning: "以下は内容を理解している管理者向けです。誤って実行すると通信に影響する可能性があります。"

  commands:
    - label: "ログイン失敗の確認"
      description: "直近のログイン失敗を確認する"
      command: "sudo grep '401\\|403' /var/log/nginx/access.log | grep '/login'"

    - label: "IPを一時ブロックする例"
      description: "攻撃元IPを遮断する"
      command: "sudo iptables -A INPUT -s {ip} -j DROP"