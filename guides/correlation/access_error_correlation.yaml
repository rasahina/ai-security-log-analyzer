title: "アクセスエラー相関（異常挙動の検知）"

plain_explanation: |
  同一のIPおよびURLに対して、正常なレスポンスとエラーレスポンスが短時間に混在しています。
  単なるアクセス失敗ではなく、攻撃や不正な入力によってサーバ側でエラーが発生している可能性があります。

immediate_actions:
  - "該当URLでエラーが継続していないか確認する"
  - "同じIPからのアクセスを一時的に制限することを検討する"
  - "該当機能に影響が出ていないか確認する"

short_term_actions:
  - "該当URLのアプリケーションログやCMSログを確認する"
  - "同様のエラーが他IP・他URLでも発生していないか確認する"

long_term_actions:
  - "エラーを発生させた入力値やURLパターンをもとに防御ルールを見直す"
  - "WAFや入力バリデーションの強化を検討する"
  - "監視対象にエラーログを継続的に含める"

escalation:
  - "500系エラーやアプリケーション例外が継続する場合は専門家へ相談する"
  - "認証・決済・管理画面など重要機能で発生している場合は緊急度を上げる"

admin_support:
  - "アプリケーションログ、サーバエラーログ、CMSログの確認を管理者に依頼する"
  - "該当URLの機能停止や一時制限が必要か相談する"

advanced_commands:
  enabled: false