Brute_Force:
  title: "Brute-force login attempts"

  plain_explanation: |
    ログイン画面に対して、短時間に複数回の失敗アクセスが確認されています。

  check_first:
    - "このIPアドレスに心当たりがあるか確認してください。"
    - "社内や委託先のアクセスでないか確認してください。"

  safe_actions:
    - "管理者パスワードを変更してください。"
    - "2段階認証が使える場合は有効にしてください。"
    - "ログイン試行回数の制限が設定されているか確認してください。"

  advanced_actions:
    - "該当IPのアクセス制限を検討してください。"
    - "認証ログを確認して、不審なログイン成功がないか確認してください。"

  escalation:
    - "不審なアクセスが継続する場合は、セキュリティ担当者または専門家に相談してください。"


Admin_Access:
  title: "Admin page access attempts"

  plain_explanation: |
    管理画面や管理用URLへのアクセスが確認されています。

  check_first:
    - "自社の管理者や保守担当者のアクセスでないか確認してください。"
    - "管理画面のURLが公開されていないか確認してください。"

  safe_actions:
    - "管理画面へのリンクを公開ページに置かないようにしてください。"
    - "管理者パスワードを変更してください。"
    - "可能であれば2段階認証を有効にしてください。"

  advanced_actions:
    - "管理画面へのアクセス制限(IP制限など)を設定してください。"
    - "WAFやファイアウォールでアクセス制御を検討してください。"

  escalation:
    - "不明なアクセスが続く場合は、セキュリティ担当者に調査を依頼してください。"


Scanner:
  title: "Automated scanning activity"

  plain_explanation: |
    存在しないページへのアクセス(404)が多く、サイトの構造を探るスキャン行為の可能性があります。

  check_first:
    - "社内ツールや監視システムによるアクセスでないか確認してください。"

  safe_actions:
    - "特に対応しなくても問題ない場合がありますが、継続的に監視してください。"

  advanced_actions:
    - "アクセス頻度が高い場合は、レート制限の導入を検討してください。"
    - "不要なエンドポイントが公開されていないか確認してください。"

  escalation:
    - "他の攻撃と組み合わさっている場合は、専門家に相談してください。"



Automated_Scanner:
  title: "Automated scanning activity"

  plain_explanation: |
    短時間に複数のページや存在しないURLへアクセスしており、自動スキャンのような動きが確認されています。

  check_first:
    - "社内ツールや監視システムによるアクセスでないか確認してください。"
    - "対象IPアドレスに心当たりがあるか確認してください。"

  safe_actions:
    - "すぐにブロックせず、アクセスの継続状況を確認してください。"
    - "不要な管理用URLや設定ファイルが公開されていないか確認してください。"

  advanced_actions:
    - "アクセス頻度が高い場合は、レート制限を検討してください。"
    - "WAFやファイアウォールで一時的な制限を検討してください。"

  escalation:
    - "管理画面アクセスやログイン失敗と組み合わさっている場合は、専門家に相談してください。"

  