title: "不審な時間帯の管理画面アクセス"

plain_explanation: |
  管理画面へのアクセスが、通常とは異なる時間帯に確認されています。
  正規の管理作業の可能性もありますが、不正ログインや侵入後の操作である可能性があります。

immediate_actions:
  - "その時間帯に正規の管理作業があったか確認する"
  - "管理者アカウントに不審なログイン成功がないか確認する"

short_term_actions:
  - "管理画面のログイン履歴と操作履歴を確認する"
  - "必要に応じて管理者アカウントのパスワードを変更する"

long_term_actions:
  - "管理画面へのアクセスに2段階認証（2FA）を導入する"
  - "管理画面へのアクセス元IP制限を検討する"
  - "深夜帯の管理アクセスに通知を設定する"

escalation:
  - "管理画面で不審な変更が確認された場合は、即座に専門家へ相談する"
  - "ログイン成功と設定変更が重なっている場合は侵害の可能性として扱う"

admin_support:
  - "管理画面のアクセスログ・操作ログの確認を管理者に依頼する"
  - "IP制限や2FAの設定を管理者に依頼する"

advanced_commands:
  enabled: true
  warning: "以下は内容を理解している管理者向けです。誤って実行すると通信に影響する可能性があります。"

  commands:
    - label: "ログイン失敗の確認"
      description: "直近のログイン失敗を確認する"
      command: "sudo grep '401\\|403' /var/log/nginx/access.log | grep '/login'"

    - label: "IPを一時ブロックする例"
      description: "攻撃元IPを遮断する"
      command: "sudo iptables -A INPUT -s {ip} -j DROP"