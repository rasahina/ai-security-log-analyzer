title: "管理画面アクセス試行"

plain_explanation: |
  管理画面（/admin など）へのアクセスが確認されています。
  正規の管理操作の可能性もありますが、不正アクセスの試行である場合もあります。

immediate_actions:
  - "管理画面へのアクセスが正当なものか確認する"
  - "不審なIPからのアクセスであれば一時的にブロックする"

short_term_actions:
  - "管理者アカウントのログイン履歴を確認する"
  - "不要な管理者アカウントを削除または無効化する"

long_term_actions:
  - "管理画面のURLを変更する（例: /admin → /secret-admin）"
  - "IP制限やVPN経由のみアクセス可能にする"

escalation:
  - "不審なログイン成功が確認された場合は即座に専門家へ相談する"

admin_support:
  - "管理画面のアクセス制御設定をホスティング会社または管理者に依頼する"

advanced_commands:
  enabled: true
  warning: "以下は内容を理解している管理者向けです。誤って実行すると通信に影響する可能性があります。"

  commands:
    - label: "ログイン失敗の確認"
      description: "直近のログイン失敗を確認する"
      command: "sudo grep '401\\|403' /var/log/nginx/access.log | grep '/login'"

    - label: "IPを一時ブロックする例"
      description: "攻撃元IPを遮断する"
      command: "sudo iptables -A INPUT -s {ip} -j DROP"