paths:
  admin:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"

  login:
    - "/login"

  suspicious:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"
    - "/.env"
    - "/config"
    - "/backup"

signals:
  repeated_login:
    score: 2
    reason: "repeated login attempts"
    window_seconds: 300
    threshold: 5

  failed_login_count:
    score: 2
    reason: "failed login count"
    window_seconds: 300
    threshold: 5

  high_failure_rate:
    score: 2
    reason: "high failure rate"
    window_seconds: 300
    minimum_count: 5
    threshold: 0.5

  login_success_after_failures:
    score: 4
    reason: "login success after failures"
    window_seconds: 300
    threshold: 3

  multiple_suspicious_paths:
    score: 2
    reason: "multiple suspicious paths"
    window_seconds: 300
    threshold: 2

  many_404:
    score: 1
    reason: "many 404 responses"
    window_seconds: 300
    threshold: 5

  admin_access:
    score: 2
    reason: "admin access attempts"
    window_seconds: 300
    threshold: 1

  burst_access:
    score: 4
    reason: "burst access detected"
    window_seconds: 60
    threshold: 5

  night_access:
    score: 1
    reason: "night time access"
    start_hour: 0
    end_hour: 5

  access_error_correlation:
    score: 3
    reason: "access error correlation"
    window_seconds: 60
    success_threshold: 1
    error_threshold: 3

attack_rules:
  Brute Force:
    requires:
      - repeated_login
      - failed_login_count
    optional:
      - high_failure_rate
      - burst_access
    bonus_score: 3

  Coordinated Brute Force:
    requires:
      - repeated_login
      - burst_access
    optional:
      - failed_login_count
    bonus_score: 5

  Scanner:
    requires:
      - many_404
      - multiple_suspicious_paths
    optional:
      - burst_access
    bonus_score: 2

  Automated Scanner:
    requires:
      - many_404
      - burst_access
    optional:
      - multiple_suspicious_paths
    bonus_score: 3

  Admin Access:
    requires:
      - admin_access
    optional:
      - failed_login_count
      - many_404
      - multiple_suspicious_paths
    bonus_score: 2

  Suspicious Admin Timing:
    requires:
      - admin_access
      - night_access
    optional:
      - failed_login_count
      - access_error_correlation
    bonus_score: 2

  Access Error Correlation:
    requires:
      - access_error_correlation
    optional:
      - burst_access
      - admin_access
    bonus_score: 2

  Reconnaissance:
    requires:
      - multiple_suspicious_paths
    optional:
      - many_404
      - admin_access
    bonus_score: 3

  Burst Access:
    requires:
      - burst_access
    optional:
      - access_error_correlation
      - many_404
      - admin_access
    bonus_score: 3

  Anomalous Timing:
    requires:
      - night_access
    optional:
      - admin_access
      - failed_login_count
    bonus_score: 1

fallback_rules:
  suspicious_activity:
    attack_type: "Suspicious Activity"
    when: "signals_exist_but_no_attack_matched"

  normal:
    attack_type: "Normal"
    when: "no_signals_and_no_attack_matched"

scoring:
  max_score_per_ip: 10

risk_levels:
  high:
    min_score: 7
    label: "HIGH"

  medium:
    min_score: 4
    label: "MEDIUM"

  low:
    min_score: 0
    label: "LOW"