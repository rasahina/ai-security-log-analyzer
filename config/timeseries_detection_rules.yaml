paths:
  admin:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"

  login:
    - "/login"

  suspicious:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"
    - "/.env"
    - "/config"
    - "/backup"

signals:
  repeated_login:
    enabled: true
    score: 2
    reason: "repeated login attempts"
    filter:
      path_group: login
    window_seconds: 300
    threshold: 5

  failed_login_count:
    enabled: true
    score: 2
    reason: "failed login count"
    filter:
      status_in: [401, 403]
    window_seconds: 300
    threshold: 5

  high_failure_rate:
    enabled: true
    score: 2
    reason: "high failure rate"
    type: ratio
    numerator_filter:
      status_in: [401, 403]
    denominator_filter:
      any: true
    window_seconds: 300
    minimum_count: 5
    threshold: 0.5
  
  login_success_after_failures:
    enabled: false
    score: 4
    reason: "login success after failures"
    window_seconds: 300
    threshold: 3

  multiple_suspicious_paths:
    enabled: false
    score: 2
    reason: "multiple suspicious paths"
    filter:
      path_group: suspicious
    window_seconds: 300
    threshold: 2

  many_404:
    enabled: true
    score: 1
    reason: "many 404 responses"
    filter:
      status: 404
    window_seconds: 300
    threshold: 5

  admin_access:
    enabled: true
    score: 2
    reason: "admin access attempts"
    filter:
      path_group: admin
    window_seconds: 300
    threshold: 1

  burst_access:
    enabled: true
    score: 4
    reason: "burst access detected"
    filter:
      any: true
    window_seconds: 60
    threshold: 5
  
  night_access:
    enabled: false
    score: 1
    reason: "night time access"
    start_hour: 0
    end_hour: 5

  access_error_correlation:
    enabled: false
    score: 3
    reason: "access error correlation"
    window_seconds: 60
    success_threshold: 1
    error_threshold: 3

  low_and_slow_scan:
    enabled: false
    score: 2
    reason: "low and slow scan detected"
    window_seconds: 86400
    threshold: 50

  low_and_slow_auth:
    enabled: false
    score: 3
    reason: "low and slow login attempts"
    window_seconds: 21600
    threshold: 10

  low_and_slow_admin_probe:
    enabled: false
    score: 3
    reason: "low and slow admin probing"
    window_seconds: 21600
    threshold: 15

attack_rules:
  Brute Force:
    requires:
      - failed_login_count
    optional:
      - repeated_login
      - high_failure_rate
      - burst_access
    base_score: 6

  Coordinated Brute Force:
    requires:
      - repeated_login
      - burst_access
    optional:
      - failed_login_count
    base_score: 7

  Scanner:
    requires:
      - many_404
    optional:
      - multiple_suspicious_paths
      - burst_access
    base_score: 4

  Automated Scanner:
    requires:
      - many_404
      - burst_access
    optional:
      - multiple_suspicious_paths
    base_score: 6

  Admin Access:
    requires:
      - admin_access
    optional:
      - failed_login_count
      - many_404
      - multiple_suspicious_paths
    base_score: 3

  Suspicious Admin Timing:
    requires:
      - admin_access
      - night_access
    optional:
      - failed_login_count
      - access_error_correlation
    base_score: 6

  Access Error Correlation:
    requires:
      - access_error_correlation
    optional:
      - burst_access
      - admin_access
    base_score: 6

  Reconnaissance:
    requires:
      - multiple_suspicious_paths
    optional:
      - many_404
      - admin_access
    base_score: 4

  Burst Access:
    requires:
      - burst_access
    optional:
      - high_failure_rate
      - many_404
      - admin_access
    base_score: 4

  Anomalous Timing:
    requires:
      - night_access
    optional:
      - admin_access
      - failed_login_count
    base_score: 2

fallback_rules:
  suspicious_activity:
    attack_type: "Suspicious Activity"
    when: "signals_exist_but_no_attack_matched"

  normal:
    attack_type: "Normal"
    when: "no_signals_and_no_attack_matched"

scoring:
  max_score_per_ip: 10

risk_levels:
  high:
    min_score: 7
    label: "HIGH"

  medium:
    min_score: 4
    label: "MEDIUM"

  low:
    min_score: 0
    label: "LOW"
signal_clusters:
  brute_force_cluster:
    enabled: true
    required:
      - failed_login_count
    optional:
      - repeated_login
      - high_failure_rate
      - burst_access
    base_confidence: 0.6
    tolerance_seconds: 300
    intensity_scale: 0.02

  reconnaissance_cluster:
    enabled: true
    required:
      - many_404
    optional:
      - burst_access
    base_confidence: 0.5
    tolerance_seconds: 300
    intensity_scale: 0.02

  admin_access_event:
    enabled: true
    required:
      - admin_access
    optional: []
    base_confidence: 0.4
    tolerance_seconds: 60
    intensity_scale: 0.01
  repeated_login_cluster:
    enabled: true
    required:
      - repeated_login

    optional:
      burst_access:
        lift: 0.15

    base_confidence: 0.45
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  burst_access_cluster:
    enabled: true
    required:
      - burst_access

    optional: {}

    base_confidence: 0.4
    default_optional_lift: 0.1
    tolerance_seconds: 60
    intensity_scale: 0.08
attacks:
  brute_force:
    enabled: true
    source_cluster: brute_force_cluster
    base_score: 6

  reconnaissance:
    enabled: true
    source_cluster: reconnaissance_cluster
    base_score: 4

  admin_access:
    enabled: true
    source_cluster: admin_access_event
    base_score: 3

  suspicious_activity:
    enabled: true
    fallback: true
    base_score: 2
score:
  global_score_cap_ratio: 2.0   # base_scoreの最大倍率
  global_intensity_cap: 1.0     # intensityの正規化上限

risk:
  risk_level_thresholds:
    low: 0
    medium: 3
    high: 6
    critical: 10