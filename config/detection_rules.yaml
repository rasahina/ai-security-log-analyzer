paths:
  admin:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"

  login:
    - "/login"

  suspicious:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"
    - "/.env"
    - "/config"
    - "/backup"

signals:
  repeated_login:
    enabled: true
    score: 2
    reason: "repeated login attempts"
    window_seconds: 300
    threshold: 5

  failed_login_count:
    enabled: true
    score: 2
    reason: "failed login count"
    filter:
      status_in: [401, 403]
    window_seconds: 300
    threshold: 5

  high_failure_rate:
    enabled: true
    score: 2
    reason: "high failure rate"
    window_seconds: 300
    minimum_count: 5
    threshold: 0.5

  login_success_after_failures:
    enabled: false
    score: 4
    reason: "login success after failures"
    window_seconds: 300
    threshold: 3

  multiple_suspicious_paths:
    enabled: true
    score: 2
    reason: "multiple suspicious paths"
    window_seconds: 300
    threshold: 2

  many_404:
    enabled: true
    score: 1
    reason: "many 404 responses"
    filter:
      status: 404
    window_seconds: 300
    threshold: 5

  admin_access:
    enabled: true
    score: 2
    reason: "admin access attempts"
    filter:
      path_group: admin
    window_seconds: 300
    threshold: 1

  burst_access:
    enabled: true
    score: 4
    reason: "burst access detected"
    filter:
      any: true
    window_seconds: 60
    threshold: 5
  
  night_access:
    enabled: false
    score: 1
    reason: "night time access"
    start_hour: 0
    end_hour: 5

  access_error_correlation:
    enabled: false
    score: 3
    reason: "access error correlation"
    window_seconds: 60
    success_threshold: 1
    error_threshold: 3

  low_and_slow_scan:
    enabled: false
    score: 2
    reason: "low and slow scan detected"
    window_seconds: 86400
    threshold: 50

  low_and_slow_auth:
    enabled: false
    score: 3
    reason: "low and slow login attempts"
    window_seconds: 21600
    threshold: 10

  low_and_slow_admin_probe:
    enabled: false
    score: 3
    reason: "low and slow admin probing"
    window_seconds: 21600
    threshold: 15

combined_signals:
  coordinated_brute_force:
    score: 3
    reason: "coordinated brute force pattern"
    requires:
      - "repeated_login"
      - "burst_access"
    suppress:
      - "repeated_login"
      - "burst_access"

  suspicious_admin_timing:
    score: 2
    reason: "suspicious admin access timing"
    requires:
      - "admin_access"
      - "night_access"
    suppress:
      - "night_access"

  automated_scanning:
    score: 2
    reason: "automated scanning pattern"
    requires:
      - "many_404"
      - "burst_access"
    suppress:
      - "many_404"
      - "burst_access"
fallback_rules:
  suspicious_activity:
    attack_type: "Suspicious Activity"
    when: "signals_exist_but_no_attack_matched"

  normal:
    attack_type: "Normal"
    when: "no_signals_and_no_attack_matched"
risk_levels:
  high:
    min_score: 7
    label: "HIGH"

  medium:
    min_score: 4
    label: "MEDIUM"

  low:
    min_score: 0
    label: "LOW"

scoring:
  max_score_per_ip: 10
attack_rules:
  Brute Force:
    requires:
      - failed_login_count
    optional:
      - repeated_login
      - high_failure_rate
      - burst_access
    base_score: 6

  Admin Access:
    requires:
      - admin_access
    optional:
      - night_access
    base_score: 3

  Scanner:
    requires:
      - many_404
    optional:
      - burst_access
      - multiple_suspicious_paths
    base_score: 4

  Reconnaissance:
    requires:
      - multiple_suspicious_paths
    optional:
      - many_404
      - admin_access
    base_score: 4

  Burst Access:
    requires:
      - burst_access
    optional:
      - high_failure_rate
    base_score: 4

  Suspicious Admin Timing:
    requires:
      - admin_access
      - night_access
    optional:
      - burst_access
    base_score: 6

  Automated Scanner:
    requires:
      - many_404
      - burst_access
    optional:
      - multiple_suspicious_paths
      - admin_access
    base_score: 6

  Access Error Correlation:
    requires:
      - access_error_correlation
    optional:
      - high_failure_rate
      - burst_access
    base_score: 6