paths:
  admin:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"

  login:
    - "/login"

  suspicious:
    - "/admin"
    - "/phpmyadmin"
    - "/wp-admin"
    - "/.env"
    - "/config"
    - "/backup"

signals:
  repeated_login:
    enabled: true
    metric_type: count
    filter:
      path_group: login
    window_seconds: 300
    threshold: 5

  failed_login_count:
    enabled: true
    metric_type: count
    filter:
      status_in: [401, 403]
    window_seconds: 300
    threshold: 5

  high_failure_rate:
    enabled: true
    metric_type: ratio
    numerator_filter:
      status_in: [401, 403]
    denominator_filter:
      any: true
    window_seconds: 300
    minimum_count: 5
    threshold: 0.5

  many_404:
    enabled: true
    metric_type: count
    filter:
      status: 404
    window_seconds: 300
    threshold: 5

  admin_access:
    enabled: true
    metric_type: count
    filter:
      path_group: admin
    window_seconds: 300
    threshold: 1

  burst_access:
    enabled: true
    metric_type: count
    filter:
      any: true
    window_seconds: 60
    threshold: 5

  multiple_suspicious_paths:
    enabled: false
    metric_type: count
    filter:
      path_group: suspicious
    window_seconds: 300
    threshold: 2

signal_clusters:
  brute_force_cluster:
    enabled: true
    required:
      - failed_login_count
    optional:
      repeated_login:
        lift: 0.25
      high_failure_rate:
        lift: 0.25
      burst_access:
        lift: 0.15
    base_confidence: 0.65
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  reconnaissance_cluster:
    enabled: true
    required:
      - many_404
    optional:
      multiple_suspicious_paths:
        lift: 0.25
      admin_access:
        lift: 0.15
      burst_access:
        lift: 0.15
    base_confidence: 0.6
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  automated_scanner_cluster:
    enabled: true
    required:
      - many_404
      - burst_access
    optional:
      multiple_suspicious_paths:
        lift: 0.25
      admin_access:
        lift: 0.1
    base_confidence: 0.7
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  admin_access_event:
    enabled: true
    required:
      - admin_access
    optional:
      failed_login_count:
        lift: 0.2
      many_404:
        lift: 0.15
      burst_access:
        lift: 0.1
    base_confidence: 0.55
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  repeated_login_cluster:
    enabled: true
    required:
      - repeated_login

    optional:
      burst_access:
        lift: 0.15

    base_confidence: 0.45
    default_optional_lift: 0.15
    tolerance_seconds: 300
    intensity_scale: 0.02

  burst_access_cluster:
    enabled: true
    required:
      - burst_access

    optional: {}

    base_confidence: 0.4
    default_optional_lift: 0.1
    tolerance_seconds: 60
    intensity_scale: 0.08
attacks:
  brute_force:
    enabled: true
    source_cluster: brute_force_cluster
    base_score: 6

  reconnaissance:
    enabled: true
    source_cluster: reconnaissance_cluster
    base_score: 4

  automated_scanner:
    enabled: true
    source_cluster: automated_scanner_cluster
    base_score: 6

  admin_access:
    enabled: true
    source_cluster: admin_access_event
    base_score: 3

  suspicious_activity:
    enabled: true
    fallback: true
    base_score: 2

score:
  global_score_cap_ratio: 2.0
  global_intensity_cap: 1.0

risk:
  risk_level_thresholds:
    low: 0
    medium: 3
    high: 6
    critical: 10